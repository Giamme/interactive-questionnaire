<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one reading column of white question sheets on a grey frame, a question index on the left, a sticky bar with progress and filters. Blue marks only the viewer's next question. */
:root{
  --bg:#eef2f6; --sheet:#ffffff; --fg:#0f172a; --muted:#475569; --faint:#64748b; --line:#e2e8f0;
  --accent:#2563eb; --on-accent:#ffffff; --accent-soft:#eff6ff; --pick-bg:#0f172a; --pick-fg:#f8fafc; --rec-bg:#f8fafc;
  --ok:#166534; --ok-bg:#dcfce7; --warn:#92400e; --warn-bg:#fef3c7; --bad:#991b1b; --bad-bg:#fee2e2;
  --shadow:0 2px 10px rgba(15,23,42,.14);
  --font:Inter, system-ui, -apple-system, "Segoe UI", sans-serif; --mono:ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --sheet:#111827; --fg:#e5e7eb; --muted:#a3adbb; --faint:#8b97a8; --line:#243041;
  --accent:#60a5fa; --on-accent:#0b1120; --accent-soft:#172554; --pick-bg:#e5e7eb; --pick-fg:#0b1120; --rec-bg:#0f172a;
  --ok:#86efac; --ok-bg:#052e16; --warn:#fcd34d; --warn-bg:#3b2a07; --bad:#fca5a5; --bad-bg:#3b0d0d;
  --shadow:0 2px 12px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1120; --sheet:#111827; --fg:#e5e7eb; --muted:#a3adbb; --faint:#8b97a8; --line:#243041;
  --accent:#60a5fa; --on-accent:#0b1120; --accent-soft:#172554; --pick-bg:#e5e7eb; --pick-fg:#0b1120; --rec-bg:#0f172a;
  --ok:#86efac; --ok-bg:#052e16; --warn:#fcd34d; --warn-bg:#3b2a07; --bad:#fca5a5; --bad-bg:#3b0d0d;
  --shadow:0 2px 12px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:16px 176px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:28px;font-weight:700;letter-spacing:-0.01em}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-top:14px}
h3{font-size:18px;font-weight:600}
h3.sub{font-size:15px}
h3[tabindex]:focus:not(:focus-visible){outline:none}
p{margin:0}
a{color:inherit;text-decoration-color:var(--faint);text-underline-offset:2px}
.top{display:flex;justify-content:flex-end}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--sheet);padding:2px}
.lang button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--pick-bg);color:var(--pick-fg)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.intro{gap:14px}
.meta{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:14px}
.meta dt{color:var(--faint)}
.meta dd{margin:0}
.lede{color:var(--muted);max-width:65ch}
.small{font-size:13px;color:var(--faint)}
.banner{border-radius:8px;padding:10px 12px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--fg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.who img{width:24px;height:24px;border-radius:50%;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn,.editbtn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--sheet);color:var(--fg);border-radius:999px;padding:4px 11px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--pick-bg);color:var(--pick-fg);border-color:var(--pick-bg)}
.chipbtn:focus-visible,.opt input:focus-visible+span,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* A question card folds to its header and a one-line summary once the viewer has answered it. */
.card,#extra{scroll-margin-top:calc(var(--bar-h,56px) + env(safe-area-inset-top,0px) + 12px)}
.card.collapsed{gap:6px}
.fold{display:grid;grid-template-rows:1fr;min-width:0}
.fold-in{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.card.collapsed .fold{grid-template-rows:0fr;opacity:0}
.anim .card{transition:gap .26s ease}
.anim .fold{transition:grid-template-rows .26s ease,opacity .2s ease}
.sum{display:flex;align-items:center;gap:10px;min-width:0;font-size:14px;color:var(--muted)}
.sum-text{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.sum-pick{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--fg)}
.sum-note{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sum-team{flex:none;color:var(--faint)}
.editbtn{flex:none}
.foot{display:flex;justify-content:flex-end}
.qhead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.qtitle{display:flex;flex-direction:column;gap:2px;min-width:0}
.qnum{font-family:var(--mono);font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap}
.tag.next{background:var(--accent);color:var(--on-accent)}
.tag.done{color:var(--faint);border:1px solid var(--line);font-weight:500}
.body{color:var(--fg);max-width:68ch;white-space:pre-line}
.rec{background:var(--rec-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.rec b{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-size:13px;color:var(--faint);padding:0;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;background:var(--sheet);cursor:pointer}
.opt input:checked+span{background:var(--pick-bg);color:var(--pick-fg);border-color:var(--pick-bg)}
textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:64px;resize:vertical}
textarea.need{border-color:var(--warn)}
.status{font-size:13px;color:var(--faint);min-height:1.2em}
.status.bad{color:var(--bad)}
.others{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.others .none{font-size:13px;color:var(--faint)}
.ans{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px}
.ans img{width:22px;height:22px;border-radius:50%}
.ans .who2{font-weight:600}
.ans .pk{font-size:12px;border-radius:999px;padding:0 8px;margin-left:6px;white-space:nowrap}
.pk.yes{background:var(--ok-bg);color:var(--ok)}
.pk.other{background:var(--warn-bg);color:var(--warn)}
.pk.unsure{border:1px solid var(--line);color:var(--faint)}
.pk.opt{border:1px solid var(--line);color:var(--fg)}
.ans .note{color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.people{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.people span{display:inline-flex;align-items:center;gap:5px}
.people img{width:18px;height:18px;border-radius:50%}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--sheet);color:var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.copyout{font-family:var(--mono);font-size:12px;min-height:160px}
.copyout.code1{min-height:96px;word-break:break-all}
/* Floating navigation: index (narrow screens), top, next unanswered, last. */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;gap:8px}
.fab button{width:44px;height:44px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--fg);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.fab button.primary{background:var(--pick-bg);color:var(--pick-fg);border-color:var(--pick-bg)}
.fab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.fab button:not(.primary):hover{border-color:var(--faint)}}
/* Question index: a sticky sheet on the left on wide screens, a drawer from the list button on narrow ones. */
.toc{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:0 8px 12px;overflow-y:auto;overscroll-behavior:contain;font-size:13px}
.toc-head{position:sticky;top:0;z-index:1;background:var(--sheet);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 8px 6px}
.toc-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.toc-title h2{padding:0;color:var(--fg)}
.toc-count{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.toc-close{display:none}
.toc ol{list-style:none;margin:0;padding:0}
.toc-group{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:12px 8px 4px}
.toc a{display:grid;grid-template-columns:16px auto minmax(0,1fr);gap:6px;align-items:start;padding:5px 8px;border-radius:6px;color:var(--fg);text-decoration:none;line-height:1.35}
.toc a[aria-current="true"]{background:var(--bg);font-weight:600}
.toc a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (hover:hover){.toc a:hover{background:var(--bg)}}
.toc .tid{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--faint);padding-top:1px;min-width:2.4em}
.mark{width:16px;height:16px;margin-top:1px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;color:transparent}
.mark svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.mark.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.mark.part{background:var(--warn-bg);border-color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.scrim{position:fixed;inset:0;z-index:7;background:rgba(15,23,42,.45)}
@media (max-width:979.98px){
  .toc{position:fixed;inset:0 auto 0 0;z-index:8;width:min(320px,88vw);border-radius:0;border-width:0 1px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:calc(8px + env(safe-area-inset-left,0px));box-shadow:var(--shadow);transform:translateX(-100%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
  .toc.open{transform:none;visibility:visible;transition:transform .25s ease}
  .toc-head{padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .toc-close{display:grid;place-items:center;flex:none;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--sheet);color:var(--fg);cursor:pointer}
  .toc-close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
}
@media (min-width:980px){
  .page{display:grid;grid-template-columns:248px minmax(0,780px);column-gap:28px;justify-content:center;padding-inline:16px}
  .page>.wrap{max-width:none;margin:0;padding-inline:0}
  .toc{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);margin-top:16px}
  .fab .fab-toc,.scrim{display:none}
}
@keyframes flash{0%{box-shadow:0 0 0 0 transparent}25%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
.flash{animation:flash 1.4s ease-out .25s}
/* Answers sent as a message, for people the page cannot save for, and the owner's import. */
.banner{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.linkbtn{font:inherit;border:0;background:none;padding:0;color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.field{font:inherit;font-size:14px;color:var(--fg);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;max-width:360px}
.field:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
[hidden]{display:none!important}
@media (max-width:520px){.sheet{padding:16px}.meta{grid-template-columns:minmax(0,1fr)}.meta dt{margin-top:6px}h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}.anim .card,.anim .fold,.toc,.toc.open{transition:none}.flash{animation:none}}
</style>

<div class="page">
<nav class="toc" id="toc" aria-labelledby="toc-h">
  <div class="toc-head">
    <div class="toc-title"><h2 id="toc-h" data-i18n="tocTitle"></h2><span class="toc-count" id="toc-count"></span></div>
    <button type="button" class="toc-close" id="toc-close" data-i18n-aria="tocClose"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <ol id="toc-list"></ol>
</nav>

<div class="wrap">
  <div class="top" id="top"><div class="lang" role="group" id="lang"></div></div>

  <header class="sheet intro">
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <dl class="meta" id="meta"></dl>
    <h3 class="sub" id="context-h" data-i18n="contextH"></h3>
    <p class="lede" id="context"></p>
    <h3 class="sub" data-i18n="howH"></h3>

      <button class="chipbtn" type="button" data-f="all" aria-pressed="true" data-i18n="fAll"></button>
      <button class="chipbtn" type="button" data-f="mine" aria-pressed="false" data-i18n="fMine"></button>
      <button class="chipbtn" type="button" data-f="open" aria-pressed="false" data-i18n="fOpen"></button>
    </div>
  </div>
  <div class="people" id="people"></div>

  <main id="qs" style="display:flex;flex-direction:column;gap:14px"></main>

  <section class="sheet" id="extra">
    <h3 tabindex="-1" data-i18n="extraH"></h3>
    <p class="body" data-i18n="extraP"></p>
    <label class="small" for="extra-note" data-i18n="extraL"></label>
    <textarea id="extra-note" data-i18n-ph="extraPh"></textarea>
    <div class="status" id="extra-status"></div>
    <div class="others" id="extra-others"></div>
  </section>

  <section class="sheet" id="send" hidden>
    <h3 tabindex="-1" data-i18n="sendH"></h3>
    <p class="body" data-i18n="sendP"></p>
    <label class="small" for="send-name" data-i18n="sendNameL"></label>
    <input class="field" id="send-name" type="text" autocomplete="name" maxlength="80" data-i18n-ph="sendNamePh">
    <div class="row"><button class="btn" type="button" id="send-make" data-i18n="sendB"></button><span class="status" id="send-status" aria-live="polite"></span></div>
    <textarea class="copyout code1" id="send-out" readonly hidden></textarea>
    <div class="row"><button class="btn" type="button" id="send-copy" data-i18n="sendCopy" hidden></button><span class="status" id="send-copied" aria-live="polite"></span></div>
  </section>

  <section class="sheet" id="import" hidden>
    <h3 id="imp-h" data-i18n="impH"></h3>
    <p class="body" data-i18n="impP"></p>
    <textarea class="copyout" id="imp-text" aria-labelledby="imp-h" data-i18n-ph="impPh"></textarea>
    <div class="row"><button class="btn" type="button" id="imp-read" data-i18n="impRead"></button><button class="btn" type="button" id="imp-save" hidden></button></div>
    <div class="status" id="imp-status" aria-live="polite"></div>
  </section>

  <section class="sheet">
    <h3 data-i18n="copyH"></h3>
    <p class="body" data-i18n="copyP"></p>
    <div><button class="btn" type="button" id="copy" data-i18n="copyB"></button> <span class="status" id="copy-status"></span></div>
    <textarea class="copyout code1" id="copyout" readonly hidden></textarea>
  </section>
</div>
</div>
<div class="scrim" id="scrim" hidden></div>

<nav class="fab" id="fab">
  <button type="button" data-go="toc" data-i18n-aria="tocOpen" class="fab-toc" aria-controls="toc" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
  <button type="button" data-go="top" data-i18n-aria="fabTop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14M12 20V9M6 14l6-6 6 6"/></svg></button>

</nav>

const C = CONFIG;

const GROUPS = {}; for (const g of C.groups || []) GROUPS[g.key] = g.label;
// Kinds: "decision" (a recommendation: yes / different / not sure), "choice" (the config's own options), "open" (a written answer).
const QS = C.questions.map(q => Object.assign({}, q, {kind: q.kind || (q.options ? "choice" : "decision")}));
const byId = {}; for (const q of QS) byId[q.id] = q;

const S = {
  lang: LANGS[0],
  db: null, user: null, myId: null, me: null,
  canSave: false, isOwner: false,
  gid: null, imp: null,   // this browser's id for answers sent as a message; a pasted message waiting to be added
  responses: {},          // uid -> doc body
  mine: {answers: {}, extra: null},
  touched: new Set(), loaded: false,
  writing: false, dirty: false, retried: false, timer: null,
  filter: "all", profiles: {},
  // Messages are kept as keys so a language switch re-renders them.
  banner: {key: "bConnecting", kind: "info"}, status: null, who: "loading",
  // Folding is per viewer and never stored: an answered card is folded unless the viewer reopened it.
  open: new Set(), pending: {}, arrow: false, animOn: false,
  tocOpen: false, cur: null, spyQueued: false, settle: null
};
const WIDE = matchMedia("(min-width: 980px)");
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function say(node, key, vars, bad) {
  if (!key) { delete node.dataset.key; delete node.dataset.vars; node.textContent = ""; node.classList.remove("bad"); return; }
  node.dataset.key = key; node.dataset.vars = vars ? JSON.stringify(vars) : "";
  node.textContent = t(key, vars); node.classList.toggle("bad", !!bad);
}
function fill(s, vars) { if (vars) for (const [k, v] of Object.entries(vars)) s = s.split("{" + k + "}").join(String(v)); return s; }
function t(key, vars) {
  const own = C.ui && C.ui[S.lang] && C.ui[S.lang][key];
  return fill(own ?? (UI[S.lang] && UI[S.lang][key]) ?? UI.en[key] ?? key, vars);
}
// Content written for this questionnaire, in the current language, falling back to the first one. {n} is the number of questions.
function ct(field) {
  const pick = l => C.content && C.content[l] && C.content[l][field];
  const s = pick(S.lang) ?? pick(LANGS[0]);
  return s ? fill(s, {n: QS.length}) : "";
}
const words = q => q[S.lang] || q[LANGS[0]];
const label = o => typeof o === "string" ? o : (o[S.lang] ?? o[LANGS[0]] ?? "");
const reduceMotion = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (_) { return false; } };

// ---------- options ----------
function optionsFor(q) {
  const unsure = {key: "unsure", label: t("pick_unsure"), short: t("short_unsure"), cls: "unsure"};
  if (q.kind === "open") return [unsure];
  if (q.kind === "choice") {
    const own = q.options.map(o => ({key: o.key, label: label(o.label), short: label(o.short || o.label), needsNote: !!o.needsNote, cls: "opt"}));
    return q.unsure === false ? own : own.concat([unsure]);
  }
  return [
    {key: "yes", label: t("pick_yes"), short: t("short_yes"), cls: "yes"},
    {key: "other", label: t("pick_other"), short: t("short_other"), needsNote: true, cls: "other"},
    unsure
  ];
}
function optionOf(q, key) {
  if (q.kind === "open" && key === "answer") return {key: "answer", short: t("short_note"), needsNote: true, cls: "opt"};
  return optionsFor(q).find(o => o.key === key) || null;
}
const isWritten = (q, a) => q.kind === "open" && a && a.pick === "answer";

// ---------- language ----------
function loadLang() { try { const v = localStorage.getItem(LANG_KEY); if (LANGS.includes(v)) S.lang = v; } catch (_) {} }
function setLang(lang) {
  if (lang === S.lang) return;
  S.lang = lang; try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
  applyLang(); for (const q of QS) refreshCard(q.id, true); refreshExtra(); refreshSummary();
}
function renderIntro() {
  $("#h1").textContent = ct("heading") || C.title;
  const lede = ct("lede"); $("#lede").textContent = lede; $("#lede").hidden = !lede;
  const meta = $("#meta"); meta.replaceChildren();
  for (const k of ["purpose", "from", "to", "used"]) {
    const v = ct(k) || (k === "used" ? t("usedDefault") : "");
    if (v) meta.append(el("dt", null, t(k + "L")), el("dd", null, v));
  }
  // Context is the questionnaire author's own HTML (links to the material it is about).
  const ctx = ct("context"); $("#context").innerHTML = ctx; $("#context").hidden = $("#context-h").hidden = !ctx;
  const kinds = new Set(QS.map(q => q.kind));
  $("#how").textContent = [ct("how"), t("how1"), kinds.has("decision") ? t("howDecision") : "", kinds.has("open") ? t("howOpen") : "", t("howFlow"), t("howNav")].filter(Boolean).join(" ");
}
function applyLang() {
  document.documentElement.lang = S.lang;
  for (const b of document.querySelectorAll("#lang button")) b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang));
  $("#lang").setAttribute("aria-label", t("langAria"));
  $("#bar").setAttribute("aria-label", t("barAria"));
  $("#filters").setAttribute("aria-label", t("filtersAria"));
  $("#people").setAttribute("aria-label", t("peopleAria"));
  $("#copyout").setAttribute("aria-label", t("copyAria"));
  $("#fab").setAttribute("aria-label", t("fabAria"));
  renderIntro();
  for (const n of document.querySelectorAll("[data-i18n]")) n.textContent = t(n.dataset.i18n);
  for (const n of document.querySelectorAll("[data-i18n-ph]")) n.placeholder = t(n.dataset.i18nPh);
  for (const n of document.querySelectorAll("[data-i18n-aria]")) { n.setAttribute("aria-label", t(n.dataset.i18nAria)); n.title = t(n.dataset.i18nAria); }
  for (const h of document.querySelectorAll("#qs h2, #toc-list .toc-group")) h.textContent = label(GROUPS[h.dataset.group] || h.dataset.group);
  for (const q of QS) {
    const w = words(q);
    $('#toc-list a[data-q="' + q.id + '"] .ttl').textContent = w.title;
    const card = $("#" + CSS.escape(q.id));
    card.querySelector("[data-role=title]").textContent = w.title;
    card.querySelector("[data-role=body]").textContent = w.body || "";
    card.querySelector("[data-role=reclabel]").textContent = t("rec");
    card.querySelector("[data-role=rectext]").textContent = w.rec || "";
    card.querySelector("[data-role=rec]").hidden = !w.rec;
    card.querySelector("legend").textContent = t("legend");
    for (const o of optionsFor(q)) card.querySelector('[data-pick="' + o.key + '"]').textContent = o.label;
  }
  renderBanner(); renderWho(); renderStatus();
  for (const n of document.querySelectorAll("[data-key]")) n.textContent = t(n.dataset.key, n.dataset.vars ? JSON.parse(n.dataset.vars) : null);
}

// ---------- static render ----------
const card$ = id => $("#" + CSS.escape(id));
const note$ = id => document.getElementById("note-" + id);
function renderLangs() {
  const box = $("#lang");
  for (const l of LANGS) {
    const b = el("button", null, (C.ui && C.ui[l] && C.ui[l].langName) || (UI[l] && UI[l].langName) || l);
    b.type = "button"; b.dataset.lang = l; b.lang = l; b.addEventListener("click", () => setLang(l)); box.append(b);
  }
  $("#top").hidden = LANGS.length < 2;
}
function renderQuestions() {
  const main = $("#qs"); let group = null;
  for (const q of QS) {
    if (q.group && q.group !== group) { group = q.group; const h = el("h2"); h.dataset.group = group; main.append(h); }
    const open = q.kind === "open";
    const card = el("article", "sheet card"); card.id = q.id;
    const head = el("div", "qhead"); const left = el("div", "qtitle");
    const h3 = el("h3"); h3.dataset.role = "title"; h3.tabIndex = -1;
    left.append(el("span", "qnum", q.id), h3);
    const tag = el("span", "tag"); tag.hidden = true; tag.dataset.role = "tag";
    head.append(left, tag);
    const sum = el("div", "sum"); sum.dataset.role = "sum"; sum.hidden = true;
    const sumText = el("span", "sum-text"); sumText.dataset.role = "sumtext";
    const edit = el("button", "editbtn"); edit.type = "button"; edit.dataset.role = "edit"; edit.dataset.i18n = "edit";

  $("#imp-save").addEventListener("click", onImpSave);

const now = () => new Date().toISOString();
function myAnswer(id) { return S.mine.answers[id] || null; }

function isDone(id) {
  const a = myAnswer(id); if (!a || !a.pick) return false;

// Codes carry answers packed tight, {Q7: [pick, note?]}. One person's code (from «Send your answers»):
// {v: 2, q: id, g: browser, n: name, t: time, a: answers, x: note?}. Everyone's (from «Copy all answers»):
// {v: 3, q: id, t: time, p: [[id, name, saved at, answers, note?], …]}, where id is a user id or "guest-<browser>".
function packed(answers) {

function packAnswers(name, answers, extra) {
  const p = {v: 2, q: KEY, g: myGid(), n: name, t: now(), a: packed(answers)};
  if (extra) p.x = extra.note;

}
function unpacked(a, at) {

// A pasted code is someone else's text: keep only known questions, valid picks and bounded notes.
const AT_RE = /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d+)?Z$/;

// One person's answers, or null when nothing usable is left.
function cleanPerson(name, given, extraNote, at) {
  name = typeof name === "string" ? oneLine(name).slice(0, 80) : "";
  if (!name) return null;
  at = cleanAt(at);
  const answers = {};
  for (const q of QS) {
    const a = given && typeof given === "object" ? given[q.id] : null;
    if (!a || typeof a !== "object") continue;
    const pick = typeof a.pick === "string" && optionOf(q, a.pick) ? a.pick : null;

// A pasted code becomes the documents to write: [{docId, name, body, replace}]. A sender's own code replaces what

function cleanPayload(p) {
  if (!p || typeof p !== "object") return {error: "impBad"};
  if (p.q !== KEY) return {error: p.v ? "impOther" : "impBad"};
  const entries = [];
  if (p.v === 1 || p.v === 2) {
    const one = p.v === 2 ? {gid: p.g, c: cleanPerson(p.n, unpacked(p.a, p.t), p.x, p.t)}

    if (!one.c) return {error: "impNone"};
    entries.push({docId: "guest-" + one.gid, name: one.c.name, replace: true,
      body: {answers: one.c.answers, extra: one.c.extra, updatedAt: one.c.at, guestName: one.c.name, importedAt: now()}});

function myGid() {

  try { const v = localStorage.getItem(GID_KEY); if (v && /^[a-z0-9]{8,32}$/.test(v)) return S.gid = v; } catch (_) {}

function goSend() {

}

async function onSendMake() {
  const name = oneLine($("#send-name").value).slice(0, 80); const st = $("#send-status");

// ---------- boot ----------
function trackBar() {
  const bar = $("#bar");
  const set = () => document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px");
  set(); try { new ResizeObserver(set).observe(bar); } catch (_) { addEventListener("resize", set); }
}
async function boot() {
  loadLang(); renderLangs(); renderQuestions(); renderToc(); applyLang(); trackBar();
  setDrawer(false);
  try { WIDE.addEventListener("change", () => setDrawer(false)); } catch (_) { WIDE.addListener(() => setDrawer(false)); }
  addEventListener("scroll", queueSpy, {passive: true});

  try { $("#send-name").value = localStorage.getItem(NAME_KEY) || ""; const g = localStorage.getItem(GID_KEY); if (g) S.gid = g; } catch (_) {}
